defaults:
  travel_mode: DRIVE
  routing_preference: TRAFFIC_AWARE
  compute_alternative_routes: true
  language_code: en-US
  units: METRIC

# Waypoints as coordinates on the correct carriageway (Google Maps: right-click -> copy
# coordinates). Aligned rectangle: north ends share lat, south ends share lat; each
# carriageway sits at a single lng. `heading` (0-360, optional) can be added if a divided
# road mis-snaps. Midvale runs N-S; SB = west carriageway, NB = east.
places:
  midvale_university_sb: { lat: 43.074269, lng: -89.451251 }   # north, SB (west) carriageway
  midvale_south_sb:      { lat: 43.059454, lng: -89.451251 }   # south, SB (west) carriageway
  midvale_south_nb:      { lat: 43.059454, lng: -89.451056 }   # south, NB (east) carriageway
  midvale_university_nb: { lat: 43.074269, lng: -89.451056 }   # north, NB (east) carriageway

routes:
  - name: midvale_sb
    corridor: "Midvale Blvd"
    direction: SB
    origin: midvale_university_sb
    destination: midvale_south_sb
    expected_distance_m: 1645   # WARN if primary route deviates >25%

  - name: midvale_nb
    corridor: "Midvale Blvd"
    direction: NB
    origin: midvale_south_nb
    destination: midvale_university_nb
    expected_distance_m: 1647

timezone: America/Chicago

# The single Cloud Scheduler job fires on this cron. A single cron cannot express the exact
# union of the slots below (cron fields are a cross-product, and the weekday hours differ from
# the weekend hours), so this is a deliberate superset: src/schedule.py skips any run that
# matches no entry in `schedules`. load_config() fails if this stops covering a schedule.
poll_window_cron: "*/10 6-9,12,15-19 * * *"

# Real polling slots. Source of truth for the in-code gate and the schedule_name label.
schedules:
  - name: am-peak
    cron: "*/10 6-9 * * 1-5"
  - name: pm-peak
    cron: "*/10 15-18 * * 1-5"
  - name: midday-baseline
    cron: "0 12 * * 1-5"
  - name: pm-shoulder
    cron: "0 19 * * 1-5"
  - name: weekend-baseline
    cron: "0 12,17 * * 6,0"
